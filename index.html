<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#741521">
<meta name="robots" content="noindex">
<title>KC Besuchsprotokoll – umgezogen</title>
<link rel="icon" href="icon-192.png">
<style>
  :root { --rot: #741521; --bg: #f4f2f0; --text: #222; --grau: #6b6b6b; }
  body { margin: 0; font: 18px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
  header { background: var(--rot); color: #fff; padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
  header img { height: 34px; } header h1 { font-size: 19px; margin: 0; font-weight: 600; }
  main { max-width: 560px; margin: 0 auto; padding: 18px 16px 60px; }
  .karte { background: #fff; border-radius: 12px; padding: 18px; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .knopf { display: block; text-align: center; background: var(--rot); color: #fff; border-radius: 11px; padding: 15px; font-weight: 700; text-decoration: none; margin-top: 16px; }
  .hinweis { color: var(--grau); font-size: 15px; }
</style>
</head>
<body>
<header><img src="kc-kochmuetze-weiss.webp" alt=""><h1>KC Besuchsprotokoll</h1></header>
<main>
  <div class="karte">
    <h2 style="margin-top:0">Umgezogen in die Köcheclub-App</h2>
    <p>Termine, Einladungen und Besuchsprotokolle gibt es jetzt nur noch in der <b>Köcheclub-App</b> unter <b>„🎓 Schulungen“</b>.</p>
    <a class="knopf" href="https://sire65.github.io/KC-Clubapp/#schulungen">🎓 Zur Köcheclub-App</a>
    <p class="hinweis">Diese alte App kann vom Startbildschirm entfernt werden. Alle Daten sind in der Köcheclub-App.</p>
  </div>
</main>
<script>
// KC-TERMINE-UMZUG (1.4.0 / Köcheclub-App 2.28.0): altes Programm stillgelegt – nur noch dieser Hinweis.
// Den alten Speicher-Helfer abmelden, damit keine alte Fassung mehr aus dem Speicher kommt.
if ("serviceWorker" in navigator) navigator.serviceWorker.getRegistrations().then((rs) => rs.forEach((r) => r.unregister())).catch(() => {});
if ("caches" in window) caches.keys().then((ks) => ks.filter((k) => k.startsWith("kc-besuche-")).forEach((k) => caches.delete(k))).catch(() => {});
</script>
</body>
</html>
