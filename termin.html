<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#741521">
<meta name="robots" content="noindex">
<title>Köcheclub Werne – Termin wählen</title>
<link rel="icon" href="icon-192.png">
<style>
  :root { --rot: #741521; --rot-hell: #f6e9eb; --text: #222; --grau: #6b6b6b; --linie: #ddd; --bg: #f4f2f0; --gruen: #1f7a3a; --orange: #b25e00; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 17px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
  header { background: var(--rot); color: #fff; padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
  header img { height: 34px; }
  header h1 { font-size: 19px; margin: 0; font-weight: 600; }
  main { max-width: 600px; margin: 0 auto; padding: 14px 14px 60px; }
  .karte { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .karte h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .04em; color: var(--rot); margin: 0 0 10px; }
  .gruss { font-size: 20px; font-weight: 600; margin: 4px 0 6px; }
  .hinweis { font-size: 15px; color: var(--grau); }
  .frist { background: var(--rot-hell); color: var(--rot); border-radius: 9px; padding: 9px 12px; font-weight: 600; font-size: 15px; margin-top: 10px; }
  .termin { border: 1.5px solid var(--linie); border-radius: 11px; padding: 12px 14px; margin-bottom: 10px; }
  .termin .wann { font-weight: 700; font-size: 18px; }
  .termin .wo { color: var(--grau); font-size: 15px; margin: 2px 0 10px; }
  .knopf { display: block; width: 100%; border: 0; border-radius: 11px; padding: 14px; font: inherit; font-size: 17px; font-weight: 600; cursor: pointer; }
  .knopf.haupt { background: var(--rot); color: #fff; }
  .knopf.zweit { background: #fff; color: var(--rot); border: 2px solid var(--rot); }
  .knopf.leise { background: none; color: var(--grau); text-decoration: underline; font-weight: 400; padding: 10px; }
  .knopf:disabled { opacity: .5; }
  .zwei { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  label { display: block; font-size: 14px; color: var(--grau); margin: 10px 0 4px; }
  input, select, textarea { width: 100%; font: inherit; padding: 11px 12px; border: 1px solid #ccc; border-radius: 9px; background: #fff; color: var(--text); }
  textarea { min-height: 70px; resize: vertical; }
  .reihe3 { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 8px; }
  .vorschlag { border-top: 1px solid #eee; padding-top: 6px; margin-top: 10px; }
  .vorschlag b { color: var(--rot); }
  .status { border-radius: 12px; padding: 16px; margin-bottom: 12px; font-size: 17px; }
  .status.gruen { background: #e5f3e9; color: #174d2a; }
  .status.orange { background: #fff1e0; color: #6d3a00; }
  .status.grau { background: #eceae8; color: #444; }
  .status .gross { font-size: 20px; font-weight: 700; margin: 6px 0; }
  .meldung { position: fixed; left: 12px; right: 12px; top: 12px; z-index: 10; padding: 13px 14px; border-radius: 10px; color: #fff; font-weight: 600; display: none; max-width: 576px; margin: 0 auto; }
  .meldung.ok { background: var(--gruen); display: block; }
  .meldung.fehler { background: #a51d1d; display: block; }
  .versteckt { display: none !important; }
  .lade { text-align: center; padding: 50px 0; color: var(--grau); }
</style>
</head>
<body>
<header><img src="kc-kochmuetze-weiss.webp" alt=""><h1>Köcheclub Werne – Termin</h1></header>
<div id="meldung" class="meldung"></div>
<main id="inhalt"><p class="lade">Wird geladen …</p></main>

<script>
// Mitgliederseite des KC Besuchsprotokolls (Feature KC-BES-TERMINE). Zugang nur über den persönlichen Link aus der Mail.
const API = "https://ptblnpiroqftcvlsrhac.supabase.co/functions/v1/kc-termine";
const T = new URL(location.href).searchParams.get("t") || "";
const $ = (id) => document.getElementById(id);
let stand = null, beschaeftigt = false;

const fTag = new Intl.DateTimeFormat("de-DE", { timeZone: "Europe/Berlin", weekday: "long", day: "2-digit", month: "2-digit", year: "numeric" });
const fZeit = new Intl.DateTimeFormat("de-DE", { timeZone: "Europe/Berlin", hour: "2-digit", minute: "2-digit" });
const fFrist = new Intl.DateTimeFormat("de-DE", { timeZone: "Europe/Berlin", weekday: "long", day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
const wann = (b, e) => `${fTag.format(new Date(b))}, ${fZeit.format(new Date(b))}–${fZeit.format(new Date(e))} Uhr`;
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function melde(t, fehler = false) {
  const m = $("meldung"); m.textContent = t; m.className = "meldung " + (fehler ? "fehler" : "ok");
  clearTimeout(melde.t); melde.t = setTimeout(() => { m.className = "meldung"; }, fehler ? 7000 : 4000);
}
const mehr = () => stand && stand.anzahl > 1;
const du = (einzel, viele) => (mehr() ? viele : einzel);
function artText(art) {
  if (art === "bei_hansi") return du("🏠 Bei Hansi – du kommst zu ihm", "🏠 Bei Hansi – ihr kommt zu ihm");
  if (art === "beim_mitglied") return du("🚗 Hansi kommt zu dir", "🚗 Hansi kommt zu euch");
  if (art === "wahl") return du("📍 Bei dir oder bei Hansi – du entscheidest", "📍 Bei euch oder bei Hansi – ihr entscheidet");
  return du("📍 Ort egal", "📍 Ort egal");
}

async function api(action, daten = {}) {
  const r = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action, t: T, ...daten }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const f = new Error(j.error || "Verbindungsfehler – bitte noch einmal versuchen."); f.stand = j.stand; f.grund = j.grund; throw f; }
  return j;
}

async function laden() {
  if (!T) return zeigeFehler("Bitte öffne diese Seite über den Link aus deiner Mail.");
  try { stand = await api("m_laden"); zeigen(); }
  catch (e) { zeigeFehler(e.message); }
}
function zeigeFehler(t) {
  $("inhalt").innerHTML = `<div class="status grau"><div class="gross">Link nicht gültig</div>${esc(t)}<p class="hinweis">Bei Fragen melde dich einfach direkt bei Hansi.</p></div>`;
}

// Hinweis Schulungsversion (ab 1.3.4), gleicher Text wie in den Mails (kc-termine: tabletHinweis)
function tabletHinweis(art) {
  const was = art === "beim_mitglied" ? du("Leg gerne ein Tablet bereit", "Legt gerne ein Tablet bereit")
    : art === "bei_hansi" ? du("Bring gerne ein Tablet mit", "Bringt gerne ein Tablet mit")
    : du("Wenn du ein Tablet hast, bring es gerne mit bzw. leg es bereit", "Wenn ihr ein Tablet habt, bringt es gerne mit bzw. legt es bereit");
  return `<p class="hinweis">📱 ${was} – dann installiert Hansi ${du("dir", "euch")} die Schulungsversion unserer Programme direkt darauf, und ${du("du kannst", "ihr könnt")} zu Hause in Ruhe weiter üben.</p>`;
}

function zeigen() {
  const s = stand, namen = s.namen.join(" und ");
  let h = `<div class="karte"><div class="gruss">Hallo ${esc(namen)}!</div>`;
  if (s.status === "offen") {
    h += `<div>Hansi möchte ${du("dich", "euch")} gerne treffen und ${du("dir", "euch")} unsere Programme zeigen. ${du("Such dir", "Sucht euch")} einfach einen Termin aus.</div>` +
      `<div class="frist">Bitte bis ${esc(fFrist.format(new Date(s.gueltig_bis)))} Uhr wählen</div>` + tabletHinweis();
  }
  h += `</div>`;

  if (s.status === "offen") {
    h += `<div class="karte"><h2>Freie Termine</h2>`;
    if (!s.frei.length) h += `<p class="hinweis">Gerade ist leider kein Termin frei. ${du("Schick", "Schickt")} Hansi unten einfach eigene Vorschläge.</p>`;
    for (const t of s.frei) {
      h += `<div class="termin"><div class="wann">${esc(wann(t.beginn, t.ende))}</div><div class="wo">${artText(t.besuchsart)}${t.notiz ? " · " + esc(t.notiz) : ""}</div>`;
      h += t.besuchsart === "wahl"
        ? `<div class="zwei"><button class="knopf haupt" onclick="waehlen('${t.id}','beim_mitglied')">${du("Bei mir", "Bei uns")}</button><button class="knopf haupt" onclick="waehlen('${t.id}','bei_hansi')">Bei Hansi</button></div>`
        : `<button class="knopf haupt" onclick="waehlen('${t.id}')">Diesen Termin nehmen</button>`;
      h += `</div>`;
    }
    h += `</div>`;
    h += `<div class="karte"><h2>Kein Termin passt?</h2>
      <p class="hinweis" style="margin-top:0">${du("Schlag", "Schlagt")} Hansi bis zu zwei eigene Termine vor.</p>
      <button id="gvKnopf" class="knopf zweit" onclick="gvZeigen()">Kein Termin passt – Gegenvorschlag</button>
      <div id="gvForm" class="versteckt">${[1, 2].map((i) => `
        <div class="vorschlag"><b>Vorschlag ${i}</b>
          <div class="reihe3">
            <div><label for="d${i}">Datum</label><input id="d${i}" type="date" min="${morgen()}"></div>
            <div><label for="v${i}">Von</label><input id="v${i}" type="time" step="900"></div>
            <div><label for="b${i}">Bis</label><input id="b${i}" type="time" step="900"></div>
          </div>
          <label for="o${i}">Wo?</label>
          <select id="o${i}"><option value="egal">egal</option><option value="beim_mitglied">${du("bei mir", "bei uns")}</option><option value="bei_hansi">bei Hansi</option></select>
        </div>`).join("")}
        <label for="gvBem">Bemerkung (freiwillig)</label><textarea id="gvBem" placeholder="z. B. vormittags passt es am besten"></textarea>
        <button class="knopf haupt" style="margin-top:12px" onclick="gegenvorschlag()">Vorschläge an Hansi schicken</button>
      </div>
      <button class="knopf leise" onclick="absagen()">${du("Ich möchte", "Wir möchten")} zurzeit keinen Besuch</button>
    </div>`;
  } else if (s.status === "gewaehlt" && s.buchung) {
    h += `<div class="status orange">✅ ${du("Du hast", "Ihr habt")} gewählt:<div class="gross">${esc(wann(s.buchung.beginn, s.buchung.ende))}</div>${artText(s.buchung.besuchsart)}
      <p>Der Termin ist für ${du("dich", "euch")} reserviert. Hansi bestätigt ihn noch – dann ${du("bekommst du", "bekommt ihr")} eine Bestätigungsmail.</p>${tabletHinweis(s.buchung.besuchsart)}</div>`;
    if (s.frist_offen) h += `<button class="knopf leise" onclick="aendern()">Doch einen anderen Termin wählen</button>`;
  } else if (s.status === "gegenvorschlag") {
    h += `<div class="status orange">💬 ${du("Deine", "Eure")} Vorschläge sind bei Hansi:<ul>${s.vorschlaege.map((v) => `<li>${esc(wann(v.beginn, v.ende))}</li>`).join("")}</ul>Er meldet sich bei ${du("dir", "euch")}.</div>`;
    if (s.frist_offen) h += `<button class="knopf leise" onclick="aendern()">Doch einen der angebotenen Termine wählen</button>`;
  } else if (s.status === "bestaetigt" && s.buchung) {
    h += `<div class="status gruen">🎉 ${du("Dein", "Euer")} Termin ist bestätigt:<div class="gross">${esc(wann(s.buchung.beginn, s.buchung.ende))}</div>📍 ${esc(s.buchung.ort || "")}
      <p>Falls etwas dazwischenkommt, ${du("gib", "gebt")} Hansi bitte kurz Bescheid.</p>${tabletHinweis(s.buchung.besuchsart)}
      <button class="knopf zweit" onclick="kalenderDatei()">📅 In meinen Kalender übernehmen</button></div>`;
  } else if (s.status === "abgesagt") {
    h += `<div class="status grau">Danke für ${du("deine", "eure")} Rückmeldung! Hansi weiß Bescheid, dass zurzeit kein Besuch gewünscht ist.</div>`;
  } else if (s.status === "abgelaufen") {
    h += `<div class="status grau">Die Antwortfrist ist leider abgelaufen. ${du("Melde dich", "Meldet euch")} gern direkt bei Hansi, dann findet ihr einen Termin.</div>`;
  } else {
    h += `<div class="status grau">Diese Einladung ist nicht mehr aktiv. Bei Fragen ${du("melde dich", "meldet euch")} direkt bei Hansi.</div>`;
  }
  $("inhalt").innerHTML = h;
}

function morgen() { const d = new Date(Date.now() + 86400000); return new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); }
function gvZeigen() { $("gvForm").classList.remove("versteckt"); $("gvKnopf").classList.add("versteckt"); $("d1").focus(); }

async function aktion(fn) {
  if (beschaeftigt) return; beschaeftigt = true;
  document.querySelectorAll("button").forEach((b) => (b.disabled = true));
  try { await fn(); }
  catch (e) {
    melde(e.message, true);
    if (e.stand) { stand = e.stand; zeigen(); }
  } finally { beschaeftigt = false; document.querySelectorAll("button").forEach((b) => (b.disabled = false)); }
}
function waehlen(id, ort) {
  const t = stand.frei.find((x) => x.id === id); if (!t) return;
  const wo = ort ? (ort === "bei_hansi" ? "bei Hansi" : du("bei dir", "bei euch")) : artText(t.besuchsart).replace(/^\S+\s/, "");
  if (!confirm(`${wann(t.beginn, t.ende)}\n${wo}\n\nDiesen Termin nehmen?`)) return;
  aktion(async () => { stand = await api("m_waehlen", { slot_id: id, besuchsart: ort || "" }); zeigen(); melde("Danke! Der Termin ist für " + du("dich", "euch") + " reserviert."); window.scrollTo(0, 0); });
}
function gegenvorschlag() {
  const v = [1, 2].map((i) => ({ datum: $("d" + i).value, von: $("v" + i).value, bis: $("b" + i).value, besuchsart: $("o" + i).value })).filter((x) => x.datum || x.von);
  if (!v.length || v.some((x) => !x.datum || !x.von)) return melde("Bitte bei jedem Vorschlag Datum und „Von“ ausfüllen.", true);
  aktion(async () => { stand = await api("m_gegenvorschlag", { vorschlaege: v, bemerkung: $("gvBem").value }); zeigen(); melde("Danke! Hansi bekommt " + du("deine", "eure") + " Vorschläge."); window.scrollTo(0, 0); });
}
function absagen() {
  const bem = prompt("Schade! Möchtest du Hansi noch etwas dazu schreiben? (freiwillig)", "");
  if (bem === null) return;
  aktion(async () => { stand = await api("m_absagen", { bemerkung: bem }); zeigen(); window.scrollTo(0, 0); });
}
function aendern() {
  if (!confirm("Die bisherige Antwort zurücknehmen und neu wählen?")) return;
  aktion(async () => { stand = await api("m_aendern"); zeigen(); window.scrollTo(0, 0); });
}
function kalenderDatei() {
  const b = stand.buchung, z = (iso) => new Date(iso).toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
  const x = (s) => String(s || "").replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\n/g, "\\n");
  const ics = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Koecheclub Werne//KC Termin//DE", "BEGIN:VEVENT",
    `UID:termin-${z(b.beginn)}-${Math.random().toString(36).slice(2)}@kc-besuchsprotokoll`, `DTSTAMP:${z(new Date().toISOString())}`,
    `DTSTART:${z(b.beginn)}`, `DTEND:${z(b.ende)}`, "SUMMARY:Köcheclub Werne – Treffen mit Hansi", `LOCATION:${x(b.ort)}`,
    "END:VEVENT", "END:VCALENDAR"].join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([ics], { type: "text/calendar" })); a.download = "Termin-Koecheclub.ics"; a.click();
}

laden();
</script>
</body>
</html>
